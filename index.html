<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCB *422# USSD Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone centred on the page, device and customer dropdowns floating top-right */
:root{
  --bg:#F2F3F4; --surface:#FFFFFF; --ink:#1E252C; --muted:#5D6873; --line:#DCE0E4;
  --gold:#F5A623; --gold-strong:#D4880D; --gold-ink:#7A4E00; --navy:#2B333C; --chip:#EEF0F2;
  --ok:#1F8A4C; --warn:#B4400E;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171B; --surface:#1C2228; --ink:#E7EBEE; --muted:#98A4AF; --line:#2D353D;
  --gold:#F9C632; --gold-strong:#F5A623; --gold-ink:#F9C632; --navy:#0D1114; --chip:#252C33;
  --ok:#5BCB88; --warn:#FF9B6A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13171B; --surface:#1C2228; --ink:#E7EBEE; --muted:#98A4AF; --line:#2D353D;
  --gold:#F9C632; --gold-strong:#F5A623; --gold-ink:#F9C632; --navy:#0D1114; --chip:#252C33;
  --ok:#5BCB88; --warn:#FF9B6A; color-scheme:dark }

html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px}

.wrap{min-height:100vh;margin:0 auto;padding-block:84px 32px;padding-inline:16px;display:flex;align-items:center;justify-content:center}
/* Floating controls */
.ctrls{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 16px);right:16px;z-index:200;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ctl{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:5px 8px 5px 14px;box-shadow:0 8px 24px -8px rgba(20,28,36,.18)}
.ctl label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctl select{appearance:none;-webkit-appearance:none;border:0;background:var(--chip);color:var(--ink);font:500 13px var(--sans);
  padding:7px 30px 7px 12px;border-radius:999px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ctl select:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px}
@media (max-width:600px){.ctrls{left:16px;right:16px;justify-content:center;flex-wrap:nowrap;gap:8px}.ctl{padding:4px;gap:0;min-width:0}
  .ctl label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ctl select{max-width:100%}}

/* ---------- Phone ---------- */
.stage-col{display:flex;justify-content:center}
.stage{position:relative}
.device{position:absolute;top:0;left:0;width:421px;height:880px;transform-origin:top left;
  border-radius:68px;padding:14px;background:linear-gradient(145deg,#3a3d42,#17181b 40%,#2a2c30);
  box-shadow:0 0 0 2px #0b0b0c inset,0 30px 60px -20px rgba(0,0,0,.45),0 12px 24px -12px rgba(0,0,0,.35)}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:#fff;color:#000;font-family:var(--ios);
  -webkit-font-smoothing:antialiased;user-select:none}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:70}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;
  padding:6px 30px 0 52px;font-weight:600;font-size:16px;z-index:65;letter-spacing:-.2px}
.sb-icons{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:80}

/* Dialer */
.dialer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.dial-num{margin-top:118px;height:56px;width:100%;padding:0 30px;text-align:center;font-size:38px;font-weight:400;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dial-add{height:22px;font-size:16px;color:#007AFF;visibility:hidden}
.dial-add.show{visibility:visible}
.keypad{margin-top:26px;display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;border:0;background:#E5E5EA;color:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:background .12s}
.key:active,.key.pressed{background:#B9B9BF}
.key .d{font-size:34px;line-height:1;font-weight:400}
.key .l{font-size:10px;font-weight:600;letter-spacing:2px;margin-top:2px;height:12px}
.key.sym .d{font-size:38px}
.dial-actions{margin-top:16px;display:grid;grid-template-columns:repeat(3,78px);gap:26px;align-items:center}
.call{width:78px;height:78px;border-radius:50%;border:0;background:#34C759;display:flex;align-items:center;justify-content:center}
.call:active{background:#2AA147}
.del{border:0;background:none;height:78px;display:flex;align-items:center;justify-content:center;visibility:hidden}
.del.show{visibility:visible}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:84px;border-top:.5px solid #d1d1d6;background:#F9F9F9;
  display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#8E8E93;font-weight:500}
.tab.on{color:#007AFF}

/* USSD overlay — iOS full-screen USSD sheet */
.ussd{position:absolute;inset:0;z-index:40;background:#6B6B6B;display:flex;flex-direction:column;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}}
.ussd[hidden]{display:none!important}
.ussd-top{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:64px 28px 16px}
.alert{width:100%;max-height:100%;display:flex;flex-direction:column}
.msg{color:#fff;font-size:15px;font-weight:500;line-height:1.72;text-align:center;white-space:pre-wrap;overflow-y:auto;min-height:0;
  overflow-wrap:anywhere;letter-spacing:-.1px;animation:fadein .2s ease}
.msg .t{margin-bottom:4px}
.msg .err{display:block;color:#FFD2CC;font-size:14px;margin-bottom:6px}
.msg.loading{display:flex;flex-direction:column;align-items:center;gap:14px}
.spin{flex:none;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ussd-bottom{flex:none;padding:0 16px 50px;display:flex;flex-direction:column;gap:12px}
.ussd.replying .ussd-bottom{padding-bottom:12px}
.field[hidden]{display:none!important}
.field input{width:100%;height:50px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;padding:0 16px;
  font:500 17px var(--ios);caret-color:#fff;text-align:center;letter-spacing:1px}
.field input::placeholder{color:rgba(255,255,255,.55);letter-spacing:0}
.field input:focus{outline:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btns.one{grid-template-columns:1fr}
.btns button{height:53px;border:0;border-radius:12px;font-size:17px;font-weight:500;font-family:var(--ios);letter-spacing:-.2px;
  transition:transform .12s,filter .12s}
.btns .w{background:#fff;color:#000}
.btns .k{background:#1C1C1E;color:#fff}
.btns button:active{transform:scale(.97);filter:brightness(.9)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.screen.ussd-on .statusbar{color:#fff}
.screen.ussd-on .homebar{background:#fff}
.statusbar svg{fill:currentColor}

/* iOS 26 phone pad keyboard */
.kb{flex:none;margin:0 6px 6px;border-radius:30px;padding:10px 8px 34px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  background:rgba(222,224,230,.82);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 0 0 .5px rgba(255,255,255,.6) inset}
.kb[hidden]{display:none!important}
.kk{height:46px;border:0;border-radius:10px;background:#fff;color:#000;box-shadow:0 1px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:var(--ios)}
.kk:active{background:#C9CBD1}
.kk .d{font-size:25px;line-height:1}
.kk .l{font-size:10px;font-weight:600;letter-spacing:2px;height:11px}
.kk.flat{background:transparent;box-shadow:none}
.kk.flat:active{background:rgba(255,255,255,.7)}

/* SMS banner */
.banner{position:absolute;top:56px;left:9px;right:9px;z-index:90;border-radius:22px;padding:12px 14px;display:flex;gap:10px;
  background:rgba(246,246,248,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 30px rgba(0,0,0,.18);transform:translateY(calc(-100% - 90px));transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.banner.show{transform:translateY(0)}
.banner .ic{flex:none;width:38px;height:38px;border-radius:9px;background:linear-gradient(#67E36F,#2DC23A);display:flex;align-items:center;justify-content:center}
.banner .bt{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.banner .bt span{font-weight:400;color:#8E8E93;font-size:13px}
.banner .bb{font-size:14px;line-height:1.3;margin-top:1px}
@media (prefers-reduced-motion:reduce){.alert,.shake{animation:none}.banner{transition:none}}


/* ---------- Keypad (feature) phone ---------- */
.fp{position:absolute;top:0;left:0;width:296px;height:700px;transform-origin:top left;border-radius:40px 40px 48px 48px;
  background:linear-gradient(165deg,#41464e 0%,#24282e 45%,#1a1d22 100%);padding:0 20px;
  box-shadow:0 0 0 1.5px #0b0c0e inset,0 2px 0 rgba(255,255,255,.12) inset,0 30px 60px -20px rgba(0,0,0,.5),0 12px 24px -12px rgba(0,0,0,.35);
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;user-select:none}
.fp[hidden],.device[hidden]{display:none!important}
.fp-speaker{height:46px;display:flex;align-items:center;justify-content:center}
.fp-speaker i{width:56px;height:5px;border-radius:3px;background:#0c0e11;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.fp-bezel{background:#0a0b0d;border-radius:10px;padding:8px;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.fp-screen{position:relative;width:240px;height:320px;background:#fff;color:#000;overflow:hidden;display:flex;flex-direction:column}
.fp-sb{flex:none;height:18px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;background:#1f2329;color:#fff;font-size:11px;font-weight:700}
.fp-sb .ic{display:flex;gap:4px;align-items:center}
.fp-body{flex:1;min-height:0;position:relative;overflow:hidden}
.fp-soft{flex:none;height:24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 6px;font-size:13px;font-weight:700;
  background:linear-gradient(#eef1f5,#cdd4dd);border-top:1px solid #aab3be;color:#111}
.fp-soft span:last-child{text-align:right}
.fp-soft span:nth-child(2){font-size:11px;color:#3a4a5e}
/* screen states */
.fp-idle{position:absolute;inset:0;background:linear-gradient(170deg,#123a5a 0%,#1d6a86 55%,#2b8a8a 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:44px}
.fp-idle .op{font-size:12px;font-weight:700;opacity:.9}
.fp-idle .tm{font-size:46px;font-weight:300;letter-spacing:1px;margin-top:10px;line-height:1}
.fp-idle .dt{font-size:13px;margin-top:6px;opacity:.9}
.fp-dial{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px 10px;text-align:right}
.fp-dial .num{font-size:30px;font-weight:700;letter-spacing:1px;overflow-wrap:anywhere;line-height:1.15}
.fp-dial .hint{font-size:11px;color:#68727d;margin-bottom:6px;text-align:left}
.fp-scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:6px 12px 8px 8px;font-size:14px;line-height:1.32;white-space:pre-wrap;overflow-wrap:anywhere}
.fp-scroll::-webkit-scrollbar{display:none}
.fp-scroll .err{display:block;color:#C4140A;font-weight:700;margin:2px 0 3px}
.fp-bar{position:absolute;top:4px;bottom:4px;right:2px;width:4px;border-radius:2px;background:#e1e5ea}
.fp-bar i{position:absolute;left:0;right:0;border-radius:2px;background:#5b6b80}
.fp-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:700}
.fp-load .pb{width:150px;height:8px;border:1px solid #6d7a8a;padding:1px}
.fp-load .pb i{display:block;height:100%;width:30%;background:#2b5d9b;animation:pb 1s linear infinite}
@keyframes pb{from{margin-left:0}to{margin-left:70%}}
.fp-reply{position:absolute;inset:0;display:flex;flex-direction:column}
.fp-reply .hd{flex:none;height:22px;background:#2b5d9b;color:#fff;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.fp-reply .hd span{font-size:10px;border:1px solid rgba(255,255,255,.7);padding:0 3px;border-radius:2px}
.fp-reply .box{margin:8px;border:1px solid #7a8796;min-height:60px;padding:5px 6px;font-size:18px;font-weight:700;letter-spacing:1px;overflow-wrap:anywhere}
.fp-reply .cur{display:inline-block;width:2px;height:19px;background:#000;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fp-reply .hint{margin:0 8px;font-size:11px;color:#68727d}
.fp-msg{position:absolute;left:10px;right:10px;top:40px;background:#fff;border:2px solid #2b5d9b;box-shadow:0 4px 12px rgba(0,0,0,.35);font-size:12px;line-height:1.3;z-index:5}
.fp-msg b{display:block;background:#2b5d9b;color:#fff;padding:2px 5px;font-size:12px}
.fp-msg div{padding:5px 6px;max-height:150px;overflow:hidden}
/* keys */
.fp-keys{padding:18px 4px 0}
.fp-nav{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:6px}
.fp-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.fp-col .fk{width:100%;padding:0}
.fk{border:0;color:#e9edf1;background:linear-gradient(#4a5058,#2c3036);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 3px rgba(0,0,0,.5);
  font-family:inherit;display:flex;align-items:center;justify-content:center}
.fk:active,.fk.pressed{background:linear-gradient(#2c3036,#3b4047);transform:translateY(1px)}
.fk.soft{height:26px;border-radius:13px}
.fk.soft i{width:22px;height:3px;border-radius:2px;background:#cfd5dc}
.fk.call{height:30px;border-radius:15px}
.dpad{position:relative;width:104px;height:104px;margin:0 auto;border-radius:50%;background:linear-gradient(#4a5058,#2a2e34);
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 3px 5px rgba(0,0,0,.55)}
.dpad button{position:absolute;border:0;background:none;color:#cfd5dc;font-size:10px;width:34px;height:30px}
.dpad .u{top:2px;left:35px}.dpad .d{bottom:2px;left:35px}.dpad .l{left:2px;top:37px;width:30px}.dpad .r{right:2px;top:37px;width:30px}
.dpad .ok{top:30px;left:30px;width:44px;height:44px;border-radius:50%;background:linear-gradient(#5a616a,#363b42);
  box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 1px 3px rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:11px}
.dpad button:active{color:#fff}
.dpad .ok:active{background:linear-gradient(#363b42,#4a5058)}
.fp-num{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 10px;margin-top:16px}
.fk.n{height:36px;border-radius:18px;flex-direction:row;gap:5px}
.fk.n .dg{font-size:19px;font-weight:700}
.fk.n .lt{font-size:9px;letter-spacing:.5px;color:#aab3bd;font-weight:700}


/* ---------- Android phone (Galaxy S-style, One UI) ---------- */
.adev{position:absolute;top:0;left:0;width:404px;height:860px;transform-origin:top left;border-radius:52px;padding:10px;
  background:linear-gradient(150deg,#5d6168 0%,#2b2e33 40%,#1b1d21 100%);
  box-shadow:0 0 0 1.5px #0d0e10 inset,0 1px 0 rgba(255,255,255,.15) inset,0 30px 60px -20px rgba(0,0,0,.45),0 12px 24px -12px rgba(0,0,0,.35)}
.adev[hidden]{display:none!important}
.ascreen{position:relative;width:384px;height:840px;border-radius:42px;overflow:hidden;background:#FCFCFC;color:#111;
  font-family:"Roboto","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-font-smoothing:antialiased}
.a-cam{position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#0b0b0d;z-index:70;box-shadow:0 0 0 2px #24272b inset}
.a-sb{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:4px 26px 0;font-size:14px;font-weight:500;z-index:65;color:#111}
.a-sb .ic{display:flex;gap:5px;align-items:center}
.a-sb svg{fill:currentColor}
.a-dialer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.a-num{margin-top:190px;height:52px;width:100%;padding:0 24px;text-align:center;font-size:36px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-keypad{margin-top:34px;display:grid;grid-template-columns:repeat(3,104px);row-gap:6px;column-gap:8px}
.ak{height:70px;border:0;background:none;border-radius:35px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;font-family:inherit;transition:background .12s}
.ak:active,.ak.pressed{background:#E6E7EB}
.ak .d{font-size:32px;line-height:1}
.ak .l{font-size:11px;color:#8a8a8f;letter-spacing:1px;height:13px;margin-top:3px}
.a-actions{margin-top:14px;display:grid;grid-template-columns:repeat(3,104px);column-gap:8px;align-items:center;justify-items:center}
.a-call{width:68px;height:68px;border-radius:50%;border:0;background:#1DBF4E;display:flex;align-items:center;justify-content:center}
.a-call:active{background:#17a142}
.a-del{border:0;background:none;visibility:hidden;height:60px;width:60px;display:flex;align-items:center;justify-content:center}
.a-del.show{visibility:visible}
.a-tabs{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:space-around;font-size:14px;color:#77777c;padding:0 34px}
.a-tabs .on{color:#111;font-weight:700}
.a-nav{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:108px;height:4px;border-radius:2px;background:#111;opacity:.7;z-index:80}
.ascreen .ussd{background:rgba(0,0,0,.42);animation:fadein .2s ease}
.ascreen .ussd-top{padding:56px 12px 12px;align-items:flex-end}
.ascreen .alert{width:100%;background:#FCFCFC;border-radius:26px;padding:22px 22px 4px;box-shadow:0 8px 30px rgba(0,0,0,.22);animation:aup .22s ease-out}
@keyframes aup{from{transform:translateY(18px);opacity:0}}
.ascreen .msg{color:#1a1a1a;text-align:left;font-size:16px;font-weight:400;line-height:1.45;letter-spacing:0;animation:none;padding:0 2px 14px}
.ascreen .msg .t{margin-bottom:2px}
.ascreen .msg .err{color:#D93025;font-size:14px}
.ascreen .msg.loading{flex-direction:row;justify-content:flex-start;gap:16px;padding:6px 2px 20px;font-size:16px;font-weight:400;color:#1a1a1a}
.ascreen .spin{border-color:rgba(3,129,254,.22);border-top-color:#0381FE}
.ascreen .field{padding:0 2px 8px}
.ascreen .field input{height:44px;border-radius:0;background:transparent;color:#111;border-bottom:2px solid #0381FE;padding:0 2px;text-align:left;
  font-family:inherit;font-size:17px;font-weight:400;caret-color:#0381FE;letter-spacing:.5px}
.ascreen .field input:focus{box-shadow:none}
.ascreen .field input::placeholder{color:#9a9a9f}
.ascreen .btns{gap:0}

.a-banner.show{transform:none}
.a-banner .ic{flex:none;width:36px;height:36px;border-radius:50%;background:#2E7CF6;display:flex;align-items:center;justify-content:center}

.a-banner .tt{font-size:14px;font-weight:700;margin-top:1px}

/* ---------- Panel ---------- */
.panel{display:flex;flex-direction:column;gap:20px;min-width:0;max-width:520px;align-self:center}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}
h1{font-size:clamp(26px,3vw,34px);line-height:1.15;margin:4px 0 8px;letter-spacing:-.02em;text-wrap:balance}
h1 code{font-family:var(--mono);font-weight:500;background:var(--navy);color:#F9C632;padding:0 .3em;border-radius:6px}
.lead{color:var(--muted);max-width:60ch;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:7px;font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--gold-strong)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1E252C}
.jumps{display:flex;flex-wrap:wrap;gap:8px}
.jumps .btn{font-size:12.5px;padding:6px 11px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.meter.over i{background:var(--warn)}
.chars{font-variant-numeric:tabular-nums}
.chars.over{color:var(--warn)}
.log{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.log .n{font-family:var(--mono);white-space:pre-wrap;background:var(--chip);border-radius:8px;padding:8px 10px;color:var(--ink);overflow-wrap:anywhere}
.log .n b{font-family:var(--sans);font-weight:600}
.log .u{align-self:flex-end;background:var(--navy);color:#F9C632;font-family:var(--mono);border-radius:8px;padding:4px 10px}
.log .s{align-self:center;color:var(--muted);font-size:12px}
.banner-body{min-width:0;flex:1}
.seg.gap-b{margin-bottom:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.card h2.gap-t{margin-top:22px}
.empty{color:var(--muted);font-size:13px}
.tests{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:grid;gap:4px}
.tests b{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:12.5px}

      return { err: `Incorrect PIN. ${3-pinTries} attempt${3-pinTries>1?'s':''} left.` };
    }
    pinTries = 0; return onOk(v);
  };
}
function newPin(next){
  return v => {
    if (!/^\d{4}$/.test(v)) return { err: 'PIN must be 4 digits.' };
    if (weak(v)) return { err: 'Avoid repeated or sequential digits. Please try again' };
    D.newPin = v; return next;
  };
}
function confirmPin(back, done){
  return v => v === D.newPin ? done() : { err: 'PINs do not match. Please try again.' };
}

  cp_done: () => ({ text: 'PIN changed successfully. Do not share your PIN with anyone, including GCB staff.\n\n0. Back', choices: { '0': () => (stack = ['landing','menu','acc'], 'SAME_ACC') } }),

  /* Help */
  help: () => ({ text: 'Need Help with GCB Digital?\nReach our customer support via:\n\nEmail: customerservice@gcb.com.gh\nToll free: 0800 422 422\nWhatsApp: 0202 422 422\n\n0. Back', choices: { '0':'BACK' } }),

  /* Outcomes */
  done: () => ({ text: 'Your request is being processed and you will be updated shortly.' + ANOTHER, choices: { '1':'menu', '2':END_THANKS } }),
  done_w2b: () => ({ text: `A payment prompt has been sent to ${MSISDN}. Enter your MoMo PIN on the prompt to approve.` + ANOTHER, choices: { '1':'menu', '2':END_THANKS } }),
  cancelled: () => ({ text: 'Transaction cancelled.' + ANOTHER, choices: { '1':'menu', '2':END_THANKS } })
};

/* ---------- Engine ---------- */
let ussd, msg, field, inp, btns, kb, alertEl, scr;
function bindDev(d){
  const a = d === 'and';
  ussd = $(a ? 'aUssd' : 'ussd'); msg = $(a ? 'aMsg' : 'msg'); field = $(a ? 'aField' : 'field'); inp = $(a ? 'aInp' : 'inp');
  btns = $(a ? 'aBtns' : 'btns'); kb = $(a ? 'aKb' : 'kb'); alertEl = $(a ? 'aAlert' : 'alert'); scr = $(a ? 'ascreen' : 'screen');
}
bindDev('ios');
const fine = matchMedia('(pointer:fine)').matches;

function nav(t){
  if (typeof t === 'function') t = t();
  if (!t) return;
  if (t === 'SAME') return transition(cur);
  if (t === 'SAME_ACC') return transition('acc');
  if (t === 'BACK'){ if (stack.length > 1) stack.pop(); return transition(stack[stack.length-1]); }
  if (t.startsWith('END:')) return transition(null, null, t.slice(4));
  if (t === 'landing') stack = ['landing'];
  else if (t === 'menu') stack = ['landing','menu'];
  else stack.push(t);
  transition(t);
}

function buttons(defs){
  btns.className = 'btns' + (defs.length === 1 ? ' one' : '');
  btns.innerHTML = '';
  defs.forEach(([label, cls, fn]) => { const x = document.createElement('button'); x.type = 'button'; x.className = cls; x.textContent = label; x.onclick = fn; btns.appendChild(x); });
}
function setMode(mode){
  if (dev === 'and'){
    const txt = !!(curScreen && curScreen.textInput); inp.inputMode = txt ? 'text' : 'none'; inp.autocapitalize = curScreen && curScreen.upper ? 'characters' : 'sentences';
    ussd.classList.remove('replying'); field.hidden = false; kb.hidden = txt;
    if (mode !== 'reply') inp.value = '';
    buttons([['Cancel','w',() => closeSession('Session cancelled')],['Send','k',send]]);
    if (fine) inp.focus({ preventScroll: true });
    return;
  }
  const reply = mode === 'reply';
  ussd.classList.toggle('replying', reply);
  const txt = !!(curScreen && curScreen.textInput); inp.inputMode = txt ? 'text' : 'none'; inp.autocapitalize = curScreen && curScreen.upper ? 'characters' : 'sentences';
  field.hidden = !reply; kb.hidden = !reply || txt;
  if (reply){
    buttons([['Cancel','w',() => setMode('view')],['Send','k',send]]);
    if (fine) inp.focus({ preventScroll: true });
  } else {
    inp.value = '';
    buttons([['Dismiss','w',() => closeSession('Session dismissed')],['Reply','k',() => setMode('reply')]]);
  }
}
function transition(id, err, endMsg){
  busy = true;
  if (dev === 'fp'){ fpSet({ mode:'loading' }); setTimeout(() => endMsg != null ? renderEnd(endMsg) : render(id, err), 900); return; }
  msg.className = 'msg loading';
  msg.innerHTML = '<div class="spin"></div><span>USSD code running…</span>';
  ussd.classList.remove('replying'); field.hidden = true; kb.hidden = true;
  buttons([[dev === 'and' ? 'Cancel' : 'Dismiss','w',() => closeSession('Session dismissed')]]);
  setTimeout(() => endMsg != null ? renderEnd(endMsg) : render(id, err), 650);
}

function render(id, err){
  busy = false; cur = id; curScreen = SC[id]();
  if (dev === 'fp'){ fpSet({ mode:'view', text: curScreen.text, err, input:'' }); return; }
  msg.className = 'msg';
  const [h, ...rest] = curScreen.text.split('\n'); const body = rest.join('\n').replace(/^\n+/, '');
  const E = err ? `<span class="err">${esc(err)}</span>` : '';
  msg.innerHTML = (curScreen.choices ? E : '') + `<div class="t">${esc(h)}</div>` + (curScreen.choices ? '' : E) + (body ? `<div class="b">${esc(body)}</div>` : '');
  inp.value = ''; msg.scrollTop = 0;
  setMode('view');
  logNet(curScreen.text, err);
  meta(id, curScreen.text);
}

function renderEnd(text){
  busy = false; cur = null; curScreen = null;
  if (dev === 'fp'){ fpSet({ mode:'end', text }); return; }
  msg.className = 'msg'; msg.textContent = text;
  ussd.classList.remove('replying'); field.hidden = true; kb.hidden = true;
  buttons([[dev === 'and' ? 'OK' : 'Dismiss','w',() => closeSession('Session ended')]]);
  logNet(text); meta('end', text);
  if (fine) btns.firstChild.focus({ preventScroll: true });
}

function send(){
  if (busy || !curScreen) return;
  const v = (dev === 'fp' ? fp.input : inp.value).trim();
  if (!v && dev === 'fp') return;
  if (!v){ field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake'); return; }
  logUser(curScreen.secret ? '••••' : v);
  if (curScreen.choices){
    const t = curScreen.choices[v];
    if (t === undefined) return transition(cur, 'Invalid option. Please try again.');
    return nav(t);
  }
  const r = curScreen.input(v);
  if (r && typeof r === 'object'){
    if (r.to){ stack.pop(); stack.push(r.to); return transition(r.to, r.err); }
    return transition(cur, r.err);
  }
  nav(r);
}

function openSession(startStack){
  D = {}; active = true; pinTries = 0;
  showU(true); clearLog();
  stack = startStack;
  transition(stack[stack.length-1]);
}
function closeSession(note){
  showU(false); active = false; busy = false; cur = null; curScreen = null;
  logSys(note); meta(null, '');
}

function showU(on){ if (dev === 'fp'){ if (!on) fpSet({ mode: dialed ? 'dial' : 'idle' }); return; } ussd.hidden = !on; scr.classList.toggle('ussd-on', on); }
function replay(){ alertEl.style.animation = 'none'; void alertEl.offsetWidth; alertEl.style.animation = ''; }
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- SMS banner ---------- */
let bannerT;
function sms(text){
  if (dev === 'fp') return fpSms(text);
  if (dev === 'and'){ $('aBannerText').textContent = text; const ab = $('aBanner'); ab.classList.add('show'); clearTimeout(bannerT); bannerT = setTimeout(() => ab.classList.remove('show'), 6000); return; }
  $('bannerText').textContent = text;
  const b = $('banner'); b.classList.add('show');
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), 6000);
  logSys('SMS: ' + text);
}
$('banner').onclick = () => $('banner').classList.remove('show');
$('aBanner').onclick = () => $('aBanner').classList.remove('show');

/* ---------- Dialer ---------- */
const KEYS = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
let dialed = '';
const keypad = $('keypad');
KEYS.forEach(([d,l]) => {
  const b = document.createElement('button'); b.type = 'button';
  b.className = 'key' + (d === '*' || d === '#' ? ' sym' : '');
  b.innerHTML = `<span class="d">${d}</span><span class="l">${l}</span>`;
  b.setAttribute('aria-label', d);
  b.dataset.k = d;
  b.onclick = () => dial(d);
  keypad.appendChild(b);
});
function dial(d){ if (active) return; if (dialed.length < 20) dialed += d; drawDial(); if (dev === 'fp') fpFlash(d); }
function drawDial(){ if (dev === 'fp' && !active) fpSet({ mode: dialed ? 'dial' : 'idle' }); $('dialNum').textContent = dialed; $('aNum').textContent = dialed; $('aDel').classList.toggle('show', !!dialed); $('dialDel').classList.toggle('show', !!dialed); $('dialAdd').classList.toggle('show', !!dialed); }
$('dialDel').onclick = () => { dialed = dialed.slice(0,-1); drawDial(); };
$('callBtn').onclick = call;
$('aCall').onclick = call;
$('aDel').onclick = () => { dialed = dialed.slice(0,-1); drawDial(); };
KEYS.forEach(([d,l]) => {
  const b = document.createElement('button'); b.type = 'button';
  b.className = 'ak'; b.dataset.k = d; b.setAttribute('aria-label', d);
  b.innerHTML = `<span class="d">${d}</span><span class="l">${l}</span>`;
  b.onclick = () => dial(d);
  $('aKeypad').appendChild(b);
});
function call(){
  if (active) return;
  if (!dialed){ dialed = '*422#'; drawDial(); return; }
  if (dialed === '*422#') return openSession(['landing']);
  showU(true); active = true; clearLog();
  transition(null, null, /^\*.*#$/.test(dialed) ? 'Connection problem or invalid MMI code.' : 'This prototype only simulates the GCB USSD code *422#.');
}

/* ---------- Phone pad keyboard ---------- */
['kb','aKb'].forEach(kid => [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0',''],['⌫','']].forEach(([d,l]) => {
  const b = document.createElement('button'); b.type = 'button';
  b.className = 'kk' + (d === '*' || d === '⌫' ? ' flat' : '');
  b.innerHTML = d === '⌫'
    ? '<svg width="26" height="20" viewBox="0 0 24 18" fill="#000"><path d="M22 0H7c-.7 0-1.2.4-1.6.9L0 9l5.4 8.1c.4.5.9.9 1.6.9h15c1.1 0 2-.9 2-2V2c0-1.1-.9-2-2-2Zm-3 12.6L17.6 14 14 10.4 10.4 14 9 12.6 12.6 9 9 5.4 10.4 4 14 7.6 17.6 4 19 5.4 15.4 9l3.6 3.6Z"/></svg>'
    : `<span class="d">${d}</span><span class="l">${l}</span>`;
  b.setAttribute('aria-label', d === '⌫' ? 'Delete' : d);
  b.onmousedown = e => e.preventDefault();
  b.onclick = () => { if (busy) return; inp.value = d === '⌫' ? inp.value.slice(0,-1) : inp.value + d; };
  $(kid).appendChild(b);
}));

/* ---------- Keyboard ---------- */
['inp','aInp'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); send(); } }));
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.ctrls')) return;
  if (active){
    if (e.key === 'Escape') closeSession('Session cancelled');
    else if (e.key === 'Enter' && !curScreen && !busy) closeSession('Session ended');
    else if (e.key === 'Enter' && curScreen && field.hidden && !busy){ e.preventDefault(); setMode('reply'); }
    else if (e.key === 'Enter' && curScreen && !field.hidden && !busy && e.target !== inp){ e.preventDefault(); send(); }
    else if (e.target !== inp && curScreen && !busy && /^[0-9*#]$/.test(e.key)){ if (field.hidden) setMode('reply'); inp.value += e.key; inp.focus({preventScroll:true}); e.preventDefault(); }
    return;
  }
  if (/^[0-9*#]$/.test(e.key)){ dial(e.key); flash(e.key); }
  else if (e.key === 'Backspace'){ dialed = dialed.slice(0,-1); drawDial(); }
  else if (e.key === 'Enter'){ e.preventDefault(); call(); }
});
function flash(k){ const b = (dev === 'and' ? $('aKeypad') : keypad).querySelector(`[data-k="${CSS.escape(k)}"]`); if (!b) return; b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 140); }

/* ---------- Panel ---------- */
function clearLog(){}
function logNet(){} function logUser(){} function logSys(){} function meta(){}

function syncSeg(){ $('selCust').value = registered ? 'reg' : 'new'; }
function resetPhone(){ if (active) closeSession('Phone reset'); dialed = ''; drawDial(); }
$('selCust').onchange = e => { registered = e.target.value === 'reg'; if (!registered) pin = null; resetPhone(); };

/* ---------- Keypad phone ---------- */
let dev = 'ios';
const fp = { mode:'idle', text:'', err:null, input:'' };
const fpBody = $('fpBody');
let fpMsgT;
function fpSet(o){ Object.assign(fp, o); fpDraw(); }
function soft(l, c, r){ $('fpL').textContent = l || ''; $('fpC').textContent = c || ''; $('fpR').textContent = r || ''; }
function fpDraw(){
  const m = fp.mode;
  if (m === 'idle'){
    fpBody.innerHTML = '<div class="fp-idle"><div class="op">MTN GH</div><div class="tm">09:41</div><div class="dt">Tue, 06 Oct</div></div>';
    soft('Menu', '', 'Contacts');
  } else if (m === 'dial'){
    fpBody.innerHTML = `<div class="fp-dial"><div class="num">${esc(dialed)}</div></div>`;
    soft('Options', '', 'Clear');
  } else if (m === 'loading'){
    fpBody.innerHTML = '<div class="fp-load">Sending request<div class="pb"><i></i></div></div>';
    soft('', '', 'Cancel');
  } else if (m === 'view' || m === 'end'){
    fpBody.innerHTML = `<div class="fp-scroll" id="fpScroll">${(() => { const [h, ...rest] = fp.text.split('\n'); return esc(h) + (fp.err ? `<span class="err">${esc(fp.err)}</span>` : (rest.length ? '\n' : '')) + esc(rest.join('\n')); })()}</div><div class="fp-bar" id="fpBar" hidden><i></i></div>`;
    const sc = $('fpScroll'); sc.onscroll = fpBarDraw; fpBarDraw();
    if (m === 'view') soft('Reply', sc.scrollHeight > sc.clientHeight + 2 ? '▼' : '', 'Exit');
    else soft('', 'OK', 'Exit');
  } else if (m === 'reply'){
    fpBody.innerHTML = `<div class="fp-reply"><div class="hd">Reply<span>${curScreen && curScreen.textInput && fp.abc ? (curScreen.upper ? 'ABC' : 'Abc') : '123'}</span></div><div class="box">${esc(curScreen && curScreen.secret ? '*'.repeat(fp.input.length) : fp.input)}<span class="cur"></span></div><div class="hint">${curScreen && curScreen.textInput ? (fp.abc ? 'Tap a key repeatedly for letters. # for 123' : 'Numbers mode. # for letters') : 'Enter option or value'}</div></div>`;
    soft('Send', '', fp.input ? 'Clear' : 'Back');
  }
}
const TAP = { '1':'.,?!1', '2':'abc2', '3':'def3', '4':'ghi4', '5':'jkl5', '6':'mno6', '7':'pqrs7', '8':'tuv8', '9':'wxyz9', '0':' 0', '*':'*', '#':'#' };
let tapKey = null, tapIdx = 0, tapT = 0;
function fpTap(k){
  const set = TAP[k] || k, now = Date.now();
  if (k === tapKey && now - tapT < 900 && fp.input.length){ tapIdx = (tapIdx + 1) % set.length; fp.input = fp.input.slice(0, -1); }
  else { tapIdx = 0; if (fp.input.length >= 30) return; }
  tapKey = k; tapT = now;
  const ch = set[tapIdx]; const up = (curScreen && curScreen.upper) || fp.input.length === 0 || /[.?!]\s$/.test(fp.input); fpSet({ input: fp.input + (up ? ch.toUpperCase() : ch) });
}
function fpBarDraw(){
  const sc = $('fpScroll'), bar = $('fpBar'); if (!sc || !bar) return;
  const over = sc.scrollHeight > sc.clientHeight + 2; bar.hidden = !over; if (!over) return;
  const h = sc.clientHeight / sc.scrollHeight * 100, t = sc.scrollTop / sc.scrollHeight * 100;
  bar.firstElementChild.style.cssText = `top:${t}%;height:${h}%`;
  if (fp.mode === 'view') $('fpC').textContent = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2 ? '▲' : '▼';
}
function fpScroll(dy){ const sc = $('fpScroll'); if (sc) sc.scrollTop += dy; }
function fpSms(text){
  const box = document.createElement('div'); box.className = 'fp-msg';
  box.innerHTML = `<b>1 new message</b><div>GCB Bank: ${esc(text)}</div>`;
  fpBody.parentElement.appendChild(box);
  clearTimeout(fpMsgT); fpMsgT = setTimeout(() => box.remove(), 5000);
  box.onclick = () => box.remove();
}
function fpKey(k){
  const m = fp.mode;
  if (k === 'end'){ if (active) closeSession('Session ended'); dialed = ''; fpSet({ mode:'idle' }); return; }
  if (/^[0-9*#]$/.test(k)){
    if (!active){ if (dialed.length < 20) dialed += k; fpSet({ mode:'dial' }); return; }
    const txt = curScreen && curScreen.textInput;
    if (m === 'view'){ if (txt){ fp.abc = true; fpSet({ mode:'reply', input:'' }); return fpKey(k); } fpSet({ mode:'reply', input:k }); return; }
    if (m === 'reply'){
      if (txt && k === '#'){ fp.abc = !fp.abc; tapKey = null; fpDraw(); return; }
      if (txt && fp.abc) return fpTap(k);
      if (fp.input.length < 30) fpSet({ input: fp.input + k }); return;
    }
    return;
  }
  if (k === 'up' || k === 'down'){ fpScroll(k === 'up' ? -40 : 40); return; }
  if (m === 'idle' || m === 'dial'){
    if (k === 'call' || k === 'ok'){ if (dialed) call(); return; }
    if (k === 'sr' && m === 'dial'){ dialed = dialed.slice(0,-1); fpSet({ mode: dialed ? 'dial' : 'idle' }); }
    return;
  }
  if (m === 'loading'){ if (k === 'sr') closeSession('Session cancelled'); return; }
  if (m === 'view'){
    if (k === 'sl' || k === 'ok'){ fp.abc = true; fpSet({ mode:'reply', input:'' }); }
    else if (k === 'sr') closeSession('Session dismissed');
    return;
  }
  if (m === 'reply'){
    if (k === 'sl' || k === 'ok' || k === 'call') send();
    else if (k === 'sr'){ if (fp.input) fpSet({ input: fp.input.slice(0,-1) }); else fpSet({ mode:'view' }); }
    return;
  }
  if (m === 'end'){ if (k === 'sl' || k === 'ok' || k === 'sr' || k === 'call') closeSession('Session ended'); }
}
[['1','.,'],['2','abc'],['3','def'],['4','ghi'],['5','jkl'],['6','mno'],['7','pqrs'],['8','tuv'],['9','wxyz'],['*','+'],['0','␣'],['#','⇧']].forEach(([d,l]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'fk n'; b.dataset.fk = d; b.setAttribute('aria-label', d);
  b.innerHTML = `<span class="dg">${d}</span><span class="lt">${l}</span>`; $('fpNum').appendChild(b);
});
$('fp').addEventListener('click', e => { const b = e.target.closest('[data-fk]'); if (b) fpKey(b.dataset.fk); });
function fpFlash(k){ const b = $('fp').querySelector(`[data-fk="${CSS.escape(k)}"]`); if (!b) return; b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 140); }
document.addEventListener('keydown', e => {
  if (dev !== 'fp' || (e.target.closest && e.target.closest('.ctrls'))) return;
  const map = { Enter:'ok', Escape:'end', Backspace:'sr', ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  if (fp.mode === 'reply' && curScreen && curScreen.textInput && /^[a-zA-Z .,]$/.test(e.key)){ e.preventDefault(); e.stopImmediatePropagation(); if (fp.input.length < 30) fpSet({ input: fp.input + (curScreen.upper ? e.key.toUpperCase() : e.key) }); return; }
  const k = /^[0-9*#]$/.test(e.key) ? e.key : map[e.key];
  if (!k) return;
  e.preventDefault(); e.stopImmediatePropagation(); fpFlash(k); fpKey(k);
}, true);
function setDev(d){
  resetPhone(); dev = d; bindDev(d);
  $('fp').hidden = d !== 'fp'; $('device').hidden = d !== 'ios'; $('adev').hidden = d !== 'and';
  $('selDev').value = d;
  if (d === 'fp') fpSet({ mode:'idle', input:'' });
  fit();
}
$('selDev').onchange = e => setDev(e.target.value);

/* ---------- Scale phone to viewport ---------- */
const stage = $('stage'), device = $('device');
function fit(){
  const el = dev === 'fp' ? $('fp') : dev === 'and' ? $('adev') : device;
  const W = dev === 'fp' ? 296 : dev === 'and' ? 404 : 421, H = dev === 'fp' ? 700 : dev === 'and' ? 860 : 880;
  const colW = Math.min(W, document.querySelector('.wrap').clientWidth - 32);
  const availH = innerHeight - 116;
  const s = Math.max(.5, Math.min(1, availH/H, colW/W));
  el.style.transform = `scale(${s})`;
  stage.style.width = W*s + 'px'; stage.style.height = H*s + 'px';
}
addEventListener('resize', fit); fit();
drawDial(); meta(null, '');
})();
